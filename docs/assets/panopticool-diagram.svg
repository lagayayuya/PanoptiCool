<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 660" font-family="ui-sans-serif,-apple-system,&#39;Segoe UI&#39;,Helvetica,Arial,sans-serif" role="img" aria-label="How PanoptiCool works: a TikTok data export is analyzed entirely in your browser; nothing leaves your device.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1024"></stop>
      <stop offset="1" stop-color="#070b18"></stop>
    </linearGradient>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2fd4f0"></path>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5b4ff"></path>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6d99"></path>
    </marker>
  </defs>

  <rect width="1560" height="660" rx="18" fill="url(#bg)"></rect>

  
  <circle cx="56" cy="52" r="5" fill="#2fd4f0"></circle>
  <text x="74" y="57" font-size="13" letter-spacing="3.5" fill="#66739a" font-weight="600">HOW PANOPTICOOL WORKS</text>

  
  <rect x="48" y="150" width="270" height="200" rx="14" fill="#0f1730" stroke="#1e2a52"></rect>
  <circle cx="80" cy="182" r="13" fill="#14203f" stroke="#2b3865"></circle>
  <text x="80" y="187" font-size="13" fill="#2fd4f0" font-weight="700" text-anchor="middle">1</text>
  <text x="102" y="187" font-size="17" fill="#e9eefb" font-weight="700">Your data export</text>
  <rect x="72" y="212" width="52" height="62" rx="7" fill="#0b1226" stroke="#36446f"></rect>
  <text x="98" y="249" font-size="13" fill="#2fd4f0" font-weight="600" text-anchor="middle" font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,monospace">.zip</text>
  <text x="140" y="230" font-size="13.5" fill="#aab6d6">Requested from TikTok.</text>
  <text x="140" y="250" font-size="13" fill="#8b98c0">Heavy, opaque,</text>
  <text x="140" y="268" font-size="13" fill="#8b98c0">unreadable as-is.</text>
  <text x="72" y="322" font-size="12.5" fill="#66739a">Dropped on the page — never uploaded.</text>

  <line x1="322" y1="250" x2="404" y2="250" stroke="#2fd4f0" stroke-width="2.5" marker-end="url(#arrA)"></line>

  
  <rect x="380" y="96" width="920" height="420" rx="16" fill="#0c1329" stroke="#2b3865" stroke-width="1.5"></rect>
  <rect x="404" y="82" width="272" height="28" rx="14" fill="#14203f" stroke="#2b3865"></rect>
  <text x="540" y="100" font-size="12" letter-spacing="1.8" fill="#7ce6f8" font-weight="700" text-anchor="middle">YOUR BROWSER · 100% LOCAL</text>

  
  <rect x="412" y="140" width="430" height="220" rx="14" fill="#0f1730" stroke="#1e2a52"></rect>
  <circle cx="444" cy="172" r="13" fill="#14203f" stroke="#2b3865"></circle>
  <text x="444" y="177" font-size="13" fill="#2fd4f0" font-weight="700" text-anchor="middle">2</text>
  <text x="466" y="177" font-size="17" fill="#e9eefb" font-weight="700">The engine — a Web Worker</text>
  <text x="436" y="200" font-size="12.5" fill="#8b98c0">Pure TypeScript · no DOM · no network</text>
  <rect x="436" y="214" width="382" height="32" rx="8" fill="#0b1226" stroke="#26325a"></rect>
  <text x="450" y="235" font-size="13.5" fill="#c8d2e8"><tspan font-weight="700" fill="#dde4f4">Ingest</tspan> — unzip · parse · validate</text>
  <path d="M627 250L627 258L623 254M627 258L631 254" stroke="#5b6d99" stroke-width="1.6" fill="none"></path>
  <rect x="436" y="262" width="382" height="32" rx="8" fill="#0b1226" stroke="#26325a"></rect>
  <text x="450" y="283" font-size="13.5" fill="#c8d2e8"><tspan font-weight="700" fill="#dde4f4">Analyze</tspan> — themes &amp; sensitive signals</text>
  <path d="M627 298L627 306L623 302M627 306L631 302" stroke="#5b6d99" stroke-width="1.6" fill="none"></path>
  <rect x="436" y="310" width="382" height="32" rx="8" fill="#0b1226" stroke="#26325a"></rect>
  <text x="450" y="331" font-size="13.5" fill="#c8d2e8"><tspan font-weight="700" fill="#dde4f4">One named result</tspan> — claims in plain words</text>

  <line x1="846" y1="200" x2="884" y2="200" stroke="#2fd4f0" stroke-width="2.5" marker-end="url(#arrA)"></line>

  
  <rect x="888" y="140" width="384" height="120" rx="14" fill="#0f1730" stroke="#1e2a52"></rect>
  <circle cx="920" cy="172" r="13" fill="#14203f" stroke="#2b3865"></circle>
  <text x="920" y="177" font-size="13" fill="#2fd4f0" font-weight="700" text-anchor="middle">3</text>
  <text x="942" y="177" font-size="17" fill="#e9eefb" font-weight="700">Results page</text>
  <text x="912" y="205" font-size="13.5" fill="#aab6d6">Your rhythms, interests and inferences —</text>
  <text x="912" y="225" font-size="13.5" fill="#aab6d6">what an algorithm could deduce about you.</text>

  <line x1="1080" y1="264" x2="1080" y2="296" stroke="#a5b4ff" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrP)"></line>

  
  <rect x="888" y="300" width="384" height="160" rx="14" fill="#0f1730" stroke="#3b4a86"></rect>
  <circle cx="920" cy="332" r="13" fill="#14203f" stroke="#3b4a86"></circle>
  <text x="920" y="337" font-size="13" fill="#a5b4ff" font-weight="700" text-anchor="middle">4</text>
  <text x="942" y="337" font-size="17" fill="#b8c4ff" font-weight="700">Local AI — optional</text>
  <text x="912" y="365" font-size="13.5" fill="#aab6d6">Raw comments &amp; searches read by a</text>
  <text x="912" y="385" font-size="13.5" fill="#aab6d6">llama.cpp server <tspan font-weight="700" fill="#dde4f4">on your own machine</tspan>.</text>
  <text x="912" y="413" font-size="12.5" fill="#8b98c0">Nothing is sent without an explicit click;</text>
  <text x="912" y="431" font-size="12.5" fill="#8b98c0">inactive until your local server responds.</text>

  
  <line x1="1302" y1="200" x2="1352" y2="200" stroke="#5b6d99" stroke-width="2" stroke-dasharray="3 6" marker-end="url(#arrD)"></line>
  <path d="M1382 232h96a22 22 0 0 0 5-43 31 31 0 0 0-60-11 24 24 0 0 0-39 19 18.5 18.5 0 0 0-2 35z" fill="#0d1428" stroke="#66739a" stroke-width="2"></path>
  <line x1="1388" y1="160" x2="1470" y2="238" stroke="#e8754e" stroke-width="6" stroke-linecap="round"></line>
  <line x1="1470" y1="160" x2="1388" y2="238" stroke="#e8754e" stroke-width="6" stroke-linecap="round"></line>
  <text x="1429" y="272" font-size="14.5" fill="#efc4b2" font-weight="700" text-anchor="middle">No server</text>
  <text x="1429" y="293" font-size="12.5" fill="#8b98c0" text-anchor="middle">no upload · no account</text>
  <text x="1429" y="311" font-size="12.5" fill="#8b98c0" text-anchor="middle">no tracking</text>

  
  <rect x="48" y="556" width="1464" height="60" rx="12" fill="#0c1e33" stroke="#1d4152"></rect>
  <rect x="76" y="580" width="18" height="14" rx="3" fill="none" stroke="#2fd4f0" stroke-width="2"></rect>
  <path d="M79 580v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#2fd4f0" stroke-width="2"></path>
  <text x="112" y="592" font-size="14.5" fill="#aab6d6"><tspan font-weight="700" fill="#7ce6f8">Privacy invariant — </tspan>your export is never sent, uploaded, or stored. There is no server to send it to: the site is a static build. It isn&#39;t a promise — it&#39;s the code you can read.</text>
</svg>