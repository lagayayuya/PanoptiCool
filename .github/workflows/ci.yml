name: CI

on:
  push:
    branches: [main]
  pull_request:

# Télémétrie Astro coupée projet-wide (ADR-0003 / éthos anti-surveillance ; relevé au bootstrap PANO-29).
env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: web — lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 LTS. Vitest 4 supporte ^20 || ^22 || >=24 — Node 23 (impair) est exclu.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Étapes TS : working-directory: web par étape (panopticool/ Python reste à la racine).
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      # L'archive de la route B (section IA) est écrite par une INTÉGRATION Astro, pas par un script
      # `postbuild` : c'est ce qui la rend indépendante de la commande qui lance le build (un
      # hébergeur appelle `astro build` directement). Ce test vérifie qu'elle sort bien du build —
      # il ne dit rien de son CONTENU, seulement qu'elle existe. Sans lui, un débranchement de
      # l'intégration laisserait la CI verte et le lien de téléchargement en 404 en production.
      - name: L'archive du site sort du build (route B, ADR-0006)
        run: test -f dist/panopticool-site.zip
        working-directory: web

  fixture:
    name: fixture Python — generate + validate (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # panopticool = stdlib only, tourne depuis la RACINE (pas de working-directory: web,
      # sinon le module est introuvable). Smoke : génère un export puis le valide.
      - name: Generate + validate synthetic export
        run: |
          python -m panopticool -o ci.zip
          python -m panopticool.validate ci.zip
