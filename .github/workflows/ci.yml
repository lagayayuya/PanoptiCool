name: CI

on:
  push:
    branches: [main]
  pull_request:

# Astro telemetry off project-wide (ADR-0003 / anti-surveillance ethos; recorded at bootstrap, PANO-29).
env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: web — lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 LTS. Vitest 4 supports ^20 || ^22 || >=24 — Node 23 (odd) is ruled out.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # TS steps: working-directory: web per step (the Python panopticool/ stays at the root).
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The route-B archive (AI section) is written by an Astro INTEGRATION, not by a `postbuild`
      # script: that is what makes it independent of the command that starts the build (a host calls
      # `astro build` directly). This test checks that it does come out of the build — it says
      # nothing about its CONTENT, only that it exists. Without it, unplugging the integration would
      # leave CI green and the download link a 404 in production.
      - name: The site archive comes out of the build (route B, ADR-0006)
        run: test -f dist/panopticool-site.zip
        working-directory: web

  fixture:
    name: fixture Python — generate + validate (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # panopticool = stdlib only, runs from the ROOT (no working-directory: web, or the module
      # cannot be found). Smoke: generate an export, then validate it.
      - name: Generate + validate synthetic export
        run: |
          python -m panopticool -o ci.zip
          python -m panopticool.validate ci.zip
