name: CI

on:
  push:
    branches: [main]
  pull_request:

# Astro telemetry off project-wide (ADR-0003 / anti-surveillance ethos; recorded at bootstrap, PANO-29).
env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: web — lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 LTS. Vitest 4 supports ^20 || ^22 || >=24 — Node 23 (odd) is ruled out.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # TS steps: working-directory: web per step (the Python panopticool/ stays at the root).
      - run: npm ci
        working-directory: web

      # ⚠ THE GEO DATABASES ARE FETCHED HERE AND NOWHERE ELSE, and the build now DEPENDS on it.
      # They are gitignored (134 MB, republished monthly), so a checkout never has them. Until
      # 2026-08-05 that was invisible: the build succeeded and wrote a route-B archive of 3 MB
      # instead of 66, amputated of the databases, with no error — and the `test -f` below went
      # green on it. The integration now refuses to write an archive it cannot complete, so a CI
      # without this step fails LOUDLY at that step. That is the intended trade.
      #
      # ⚠ NOT AN npm `prebuild`, deliberately. A `prebuild` only runs when the build goes through
      # the npm script, and a host that detects Astro runs `astro build` directly — which is the
      # exact hole `integrations/site-zip.ts` exists to avoid. Here the step is explicit in the
      # pipeline, and the CHECK that the archive is complete lives with the archive.
      - name: Cache the geo databases
        id: geo-cache
        uses: actions/cache@v4
        with:
          path: web/public/geo
          # Bump the suffix to force a refresh: DB-IP republishes monthly and the key has no date
          # in it on purpose — a dated key would redownload 134 MB on the first CI run of every
          # month, for databases whose freshness nothing here depends on.
          key: geo-dbip-city-lite-v1
      - name: Fetch the geo databases
        if: steps.geo-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-geo-db.mjs
        working-directory: web

      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The route-B archive (AI section) is written by an Astro INTEGRATION, not by a `postbuild`
      # script: that is what makes it independent of the command that starts the build (a host calls
      # `astro build` directly). This test checks that it does come out of the build — it says
      # nothing about its CONTENT, only that it exists. Without it, unplugging the integration would
      # leave CI green and the download link a 404 in production.
      - name: The site archive comes out of the build (route B, ADR-0006)
        run: test -f dist/panopticool-site.zip
        working-directory: web
      # ⚠ AND IT CARRIES WHAT IT PROMISES. `test -f` passed for months on an archive missing its
      # geo databases: the file existed, so the check was green, and nobody could tell from CI.
      # The integration is what refuses to write that archive; this asserts the outcome from
      # outside it, so unplugging the guard is caught here rather than by a downloader.
      - name: And it carries the geo databases and the licence files
        run: |
          unzip -l dist/panopticool-site.zip | grep -q 'geo/dbip-city-ipv4.mmdb'
          unzip -l dist/panopticool-site.zip | grep -q 'geo/dbip-city-ipv6.mmdb'
          unzip -l dist/panopticool-site.zip | grep -q 'NOTICE'
          unzip -l dist/panopticool-site.zip | grep -q 'LICENSE'
        working-directory: web

  fixture:
    name: fixture Python — generate + validate (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # panopticool = stdlib only, runs from the ROOT (no working-directory: web, or the module
      # cannot be found). Smoke: generate an export, then validate it.
      - name: Generate + validate synthetic export
        run: |
          python -m panopticool -o ci.zip
          python -m panopticool.validate ci.zip
